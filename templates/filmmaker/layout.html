<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta property="og:title" content="{{ogTitle}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="https://{{domain}}{{canonicalPath}}">
  <meta property="og:image" content="{{ogImage}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{name}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ogTitle}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{ogImage}}">
  <link rel="canonical" href="https://{{domain}}{{canonicalPath}}">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://ourpraxis.network" crossorigin>
  <link rel="dns-prefetch" href="https://ourpraxis.network">

  <link rel="stylesheet" href="/template-style.css">
  <link rel="stylesheet" href="/phosphor.css">
  <link rel="modulepreload" href="/js/vendor.js">
  <style>:root { --bg: {{themeBg}}; --fg: {{themeFg}}; --accent: {{themeAccent}}; --muted: {{themeMuted}}; --dim: {{themeDim}}; --surface: color-mix(in srgb, {{themeFg}} 4%, transparent); --border: color-mix(in srgb, {{themeFg}} 10%, transparent); --border-hover: color-mix(in srgb, {{themeFg}} 18%, transparent); --green: {{themeGreen}}; --font: {{themeFont}}; }</style>
  <script>
  (function(){var l=localStorage.getItem('praxis-lang')||navigator.language?.slice(0,2)||'en';document.documentElement.lang=l;if(['ar','fa','ur'].includes(l))document.documentElement.dir='rtl'})()
  </script>
  {{noindex}}
  {{jsonLd}}
  <meta name="stripe-pk" content="pk_live_51PKwQcEHrz6OfbzifTK5ekkSbb1py7R91k0LBlYh7skdpmkzPKA3bu5wYTGjho5C3tsf1Elv8eNHBrmTXnedbSPt00Glg5Srec">
</head>
<body data-owner="{{wallet}}" data-blog="{{blogRegistry}}" data-media="{{mediaRegistry}}" data-registry="{{registry}}" data-supporter="{{supporter}}">
  <script>
    // anti-flash: if last connected wallet matches site owner, enter feed mode before paint
    try {
      var w = localStorage.getItem('praxis-wallet')
      var o = document.body.dataset.owner
      if (w && o && w === o.toLowerCase() && !sessionStorage.getItem('wallet-disconnected')) {
        document.body.classList.add('feed-mode-pending')
      }
    } catch(e) {}
  </script>
  <header id="top-bar">
    <a href="/" class="site-identity">{{domain}}</a>
    <div id="praxis-menu-trigger">
      <span id="praxis-menu-label">praxis</span>
      <button id="praxis-menu-btn" aria-label="Menu"><i class="ph ph-planet"></i></button>
    </div>
    <div id="praxis-menu-dropdown" class="praxis-dropdown-hidden">
      <a href="/network" data-i18n="nav.network">network</a>
      <a href="/projects" data-i18n="nav.projects">projects</a>
      <a href="/library" data-i18n="nav.library">library</a>
      <span id="top-bar-wallet"></span>
      <div class="praxis-menu-row">
        <select id="lang-switcher" class="lang-switcher">
          <option value="en">EN</option><option value="es">ES</option><option value="fr">FR</option>
          <option value="pt">PT</option><option value="de">DE</option><option value="ar">AR</option>
          <option value="zh">ZH</option><option value="ja">JA</option><option value="ko">KO</option>
          <option value="hi">HI</option><option value="sw">SW</option><option value="ru">RU</option>
          <option value="bn">BN</option><option value="id">ID</option><option value="tr">TR</option>
          <option value="vi">VI</option><option value="fa">FA</option><option value="ur">UR</option>
        </select>
        <select id="currency-switcher" class="lang-switcher">
          <option value="usd">USD</option><option value="eur">EUR</option><option value="gbp">GBP</option>
          <option value="jpy">JPY</option><option value="cny">CNY</option><option value="brl">BRL</option>
          <option value="ngn">NGN</option><option value="kes">KES</option><option value="inr">INR</option>
          <option value="krw">KRW</option>
        </select>
      </div>
    </div>
    <button id="mobile-menu-btn" style="display:none;background:none;border:none;color:var(--fg);font-size:1.3em;cursor:pointer;padding:0.2em" aria-label="Menu"><i class="ph ph-list"></i></button>
  </header>

  <main>
    {{content}}
  </main>

  <footer>
    <p>{{name}} — <a href="https://{{domain}}">{{domain}}</a></p>
    <a href="https://ourpraxis.network" class="praxis-badge">praxis</a>
  </footer>

  <nav class="portfolio-nav">
    {{portfolioNav}}
  </nav>

  <div id="mobile-menu-overlay"></div>
  <div id="mobile-menu-sheet">
    <div id="mobile-portfolio-section"><div class="mobile-menu-section-title" data-i18n="menu.portfolio">portfolio</div>
    <div id="mobile-portfolio-nav">{{portfolioNav}}</div></div>
    <div class="mobile-menu-section-title" style="margin-top:0.5em" data-i18n="menu.praxis">praxis</div>
    <a href="/network" class="mobile-menu-item">network</a>
    <a href="/projects" class="mobile-menu-item">projects</a>
    <a href="/library" class="mobile-menu-item">library</a>
    <div class="mobile-menu-section" id="mobile-menu-owner-nav" style="display:none">
      <div class="mobile-menu-section-title" style="margin-top:1em" data-i18n="menu.account">account</div>
      <a href="/notifications" class="mobile-menu-item">notifications</a>
      <a href="/earnings" class="mobile-menu-item">earnings</a>
      <a href="#" class="mobile-menu-item" id="mobile-settings-btn">settings</a>
    </div>
  </div>
  <script>
  (function(){
    var btn = document.getElementById('mobile-menu-btn')
    var sheet = document.getElementById('mobile-menu-sheet')
    var overlay = document.getElementById('mobile-menu-overlay')
    if (!btn || !sheet) return

    function closeMenu() {
      sheet.classList.remove('open')
      if (overlay) overlay.classList.remove('open')
    }
    function toggleMenu() {
      sheet.classList.toggle('open')
      if (overlay) overlay.classList.toggle('open')
    }

    btn.addEventListener('click', toggleMenu)
    if (overlay) overlay.addEventListener('click', closeMenu)

    // populate portfolio links from the nav
    var portfolioNav = document.querySelector('.portfolio-nav')
    var mobilePortfolioLinks = document.getElementById('mobile-portfolio-links')
    if (portfolioNav && mobilePortfolioLinks) {
      var links = portfolioNav.querySelectorAll('a')
      links.forEach(function(a) {
        var link = document.createElement('a')
        link.href = a.href
        link.className = 'mobile-menu-item'
        link.textContent = a.textContent
        mobilePortfolioLinks.appendChild(link)
      })
    }

    sheet.querySelectorAll('a, button').forEach(function(el) {
      el.addEventListener('click', closeMenu)
    })

    var pt = document.getElementById('mobile-portfolio-toggle')
    var mc = document.getElementById('mobile-compose')
    var ms = document.getElementById('mobile-settings-btn')
    if (pt) pt.addEventListener('click', function() { window.dispatchEvent(new CustomEvent('toggle-portfolio')) })
    if (mc) mc.addEventListener('click', function() { window.dispatchEvent(new CustomEvent('open-compose')) })
    if (ms) ms.addEventListener('click', function(e) { e.preventDefault(); closeMenu(); window.dispatchEvent(new CustomEvent('open-settings')) })

    function checkOwner(addr) {
      var owner = document.body.dataset.owner
      var sec = document.getElementById('mobile-menu-owner-nav')
      if (!sec || !owner) return
      var show = addr && addr.toLowerCase() === owner.toLowerCase(); sec.style.display = show ? '' : 'none'; var ps = document.getElementById("mobile-portfolio-section"); if (ps) ps.style.display = show ? "none" : ""
    }
    window.addEventListener('wallet-connected', function(e) { checkOwner(e.detail && e.detail.address) })
    window.addEventListener('wallet-disconnected', function() { checkOwner(null) })
    try {
      var cached = localStorage.getItem('praxis-wallet')
      if (cached && !sessionStorage.getItem('wallet-disconnected')) checkOwner(cached)
    } catch(e) {}

    // --- planet menu dropdown ---
    var pmBtn = document.getElementById('praxis-menu-btn')
    var pmTrigger = document.getElementById('praxis-menu-trigger')
    var pmDrop = document.getElementById('praxis-menu-dropdown')
    if (pmBtn && pmDrop && pmTrigger) {
      pmBtn.addEventListener('click', function(e) {
        e.stopPropagation()
        var open = !pmDrop.classList.contains('praxis-dropdown-hidden')
        if (open) {
          pmDrop.classList.add('praxis-dropdown-hidden')
          pmTrigger.classList.remove('menu-open')
        } else {
          pmDrop.classList.remove('praxis-dropdown-hidden')
          pmTrigger.classList.add('menu-open')
        }
      })
      document.addEventListener('click', function(e) {
        if (!pmTrigger.contains(e.target) && !pmDrop.contains(e.target)) {
          pmDrop.classList.add('praxis-dropdown-hidden')
          pmTrigger.classList.remove('menu-open')
        }
      })
      pmDrop.querySelectorAll('a').forEach(function(a) {
        a.addEventListener('click', function() {
          pmDrop.classList.add('praxis-dropdown-hidden')
          pmTrigger.classList.remove('menu-open')
        })
      })
    }
  })()
  </script>

  <script type="module" src="/js/i18n.js"></script>
  <script type="module" src="/js/player.js"></script>
  <script type="module" src="/js/mini-player.js"></script>
  <script type="module" src="/js/spa.js"></script>
  <script type="module" src="/js/wallet.js"></script>
  <script type="module" src="/js/lazy.js"></script>
  <script type="module" src="/js/media.js"></script>
  <script type="module" src="/js/notifications.js"></script>
  <script type="module" src="/js/fiat.js"></script>
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{})</script>
</body>
</html>
