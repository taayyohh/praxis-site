<header>
  <div class="org-header-row">
    <img id="org-logo" class="org-logo" src="{{profilePic}}" alt="" onerror="this.style.display='none'" loading="lazy">
    <div>
      <h1>{{name}}</h1>
      <p class="bio" id="bio-short">{{shortBio}}</p>
      <p class="bio" id="bio-full" style="display:none">{{bio}}</p>
      <a href="#" id="bio-toggle" style="color:var(--muted);font-size:0.8em;text-decoration:none;display:inline-block;margin-top:0.3em">more</a>
    </div>
  </div>
<script>(function(){var s=document.getElementById('bio-short'),f=document.getElementById('bio-full'),t=document.getElementById('bio-toggle');if(!s||!f||!t)return;if(!f.textContent.trim()||f.textContent.trim()===s.textContent.trim()){t.style.display='none';return}t.addEventListener('click',function(e){e.preventDefault();if(f.style.display==='none'){f.style.display='';s.style.display='none';t.textContent='less'}else{f.style.display='none';s.style.display='';t.textContent='more'}})})();</script>
  <div id="owner-badges"></div>
</header>

<div id="org-roster"></div>

<div id="portfolio-highlights">{{highlights}}</div>

<div id="portfolio-cv">
  {{cv}}
</div>

<div id="feed" style="display:none" data-blog="{{blogRegistry}}" data-owner="{{wallet}}">
  <p id="feed-status" style="color:var(--muted)"><span class="praxis-loader"></span></p>
  <div id="feed-posts"></div>
</div>
